<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Devil Run</title>
<style>
body { margin:0; background:#ff8c00; overflow:hidden; }
canvas { display:block; margin:0 auto; background:#ff8c00; }
</style>
</head>

<body>
<canvas id="game" width="800" height="400"></canvas>

<script>
// ===== BASIC SETUP =====
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let keys = {};
document.addEventListener("keydown", e=>keys[e.key]=true);
document.addEventListener("keyup", e=>keys[e.key]=false);

// ===== PLAYER =====
let player = {x:50,y:300,w:20,h:20,vy:0,jump:false};
let gravity = 0.8;

// ===== GAME DATA =====
let Level = 1;
let Deaths = 0;

// ===== CACHE LEVEL =====
function saveCache(data){
  localStorage.setItem("levelCache", JSON.stringify(data));
}
function loadCache(){
  return JSON.parse(localStorage.getItem("levelCache") || "{}");
}

// ===== GENERATE LEVEL =====
function generateLevel(){
  return {
    platforms:[
      {x:0,y:350,w:800,h:50,type:"solid"},
      {x:200,y:300,w:100,h:10,type:"fake"},
      {x:400,y:250,w:100,h:10,type:"solid"}
    ],
    spikes:[
      {x:300,y:330,w:20,h:20}
    ],
    door:{x:750,y:320,w:30,h:30,type:Math.random()>0.3?"true":"fake"}
  };
}

function getLevel(){
  let cache = loadCache();
  if(cache[Level]) return cache[Level];

  let lvl = generateLevel();
  cache[Level] = lvl;
  saveCache(cache);
  return lvl;
}

// ===== LOAD LEVEL =====
let platforms = [];
let spikes = [];
let door = {};

function loadLevel(){
  let data = getLevel();
  platforms = data.platforms;
  spikes = data.spikes;
  door = data.door;
}
loadLevel();

// ===== RESET =====
function reset(){
  player.x=50;
  player.y=300;
  player.vy=0;
}

// ===== NEXT LEVEL =====
function nextLevel(){
  Level++;

  // infinite upgrade sedikit
  let cache = loadCache();
  cache[Level] = generateLevel();
  saveCache(cache);

  loadLevel();
  reset();
}

// ===== COLLISION =====
function col(a,b){
  return a.x < b.x+b.w &&
         a.x+a.w > b.x &&
         a.y < b.y+b.h &&
         a.y+a.h > b.y;
}

// ===== UPDATE =====
function update(){

  if(keys["ArrowRight"]) player.x += 3;
  if(keys["ArrowLeft"]) player.x -= 3;

  if(keys[" "] && !player.jump){
    player.vy = -12;
    player.jump = true;
  }

  player.vy += gravity;
  player.y += player.vy;

  player.jump = true;

  // PLATFORM
  for(let p of platforms){
    if(col(player,p)){
      if(p.type==="fake"){
        setTimeout(()=>{
          p.y=-999;
          spikes.push({x:p.x,y:330,w:20,h:20});
        },200);
      }
      player.y = p.y-player.h;
      player.vy = 0;
      player.jump = false;
    }
  }

  // SPIKE
  for(let s of spikes){
    if(col(player,s)){
      Deaths++;
      reset();
    }
  }

  // DOOR
  if(col(player,door)){
    if(door.type==="true"){
      nextLevel();
    } else {
      reset();
    }
  }

  // fall
  if(player.y>400){
    Deaths++;
    reset();
  }
}

// ===== DRAW =====
function draw(){
  ctx.clearRect(0,0,800,400);

  // player
  ctx.fillStyle="white";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  // platforms
  for(let p of platforms){
    ctx.fillStyle=p.type==="fake"?"gray":"black";
    ctx.fillRect(p.x,p.y,p.w,p.h);
  }

  // spikes
  ctx.fillStyle="red";
  for(let s of spikes){
    ctx.fillRect(s.x,s.y,s.w,s.h);
  }

  // door
  ctx.fillStyle="blue";
  ctx.fillRect(door.x,door.y,door.w,door.h);

  // UI
  ctx.fillStyle="white";
  ctx.fillText("Level: "+Level,10,20);
  ctx.fillText("Deaths: "+Deaths,10,40);
}

// ===== LOOP =====
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
